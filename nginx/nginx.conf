server {
    listen 80;

    # Serve the built React site.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Everything under /api goes to the Go API, with the /api prefix removed.
    location /api/ {
        proxy_pass http://api:8080/;
        client_max_body_size 2g;
    }

    # The workers' HLS files go through the cache, which keeps recent segments
    # in memory and fetches the rest from the API.
    location /hls/ {
        proxy_pass http://cache:8082/hls/;

        # A finished file never changes, so the browser may keep it for a
        # year. Missing files (404) aren't kept, so a video still processing
        # can be fetched again once it's ready.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
