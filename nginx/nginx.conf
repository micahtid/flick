server {
    listen 80;

    # The built React site.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Everything under /api goes to the Go API, with the /api prefix removed.
    location /api/ {
        proxy_pass http://api:8080/;
        client_max_body_size 2g;
    }
}
