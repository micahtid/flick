server {
    listen 80;

    # The built React site.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Everything under /api goes to the Go API, with the /api prefix removed.
    location /api/ {
        proxy_pass http://api:8080/;
        client_max_body_size 2g;
    }

    # The workers' HLS files, served straight from the shared uploads volume:
    # /hls/<id>/master.m3u8 is read from /data/hls/<id>/master.m3u8.
    location /hls/ {
        alias /data/hls/;

        # Tell the browser what each kind of file is.
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
            image/jpeg                    jpg;
        }

        # A finished file never changes, so the browser may keep it for a
        # year. Missing files (404) aren't kept, so a video still processing
        # can be fetched again once it's ready.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
