server {
    listen 80;

    # Serve the built React website.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Everything under /api goes to the Go API, with the /api prefix removed.
    # Uploads are passed on as they arrive, instead of saved to disk first, so
    # the progress bar shows how much the API has really received.
    location /api/ {
        proxy_pass http://api:8080/;
        client_max_body_size 2g;
        proxy_request_buffering off;
    }

    # Chat keeps a WebSocket open, which starts as a normal request that asks
    # to "upgrade" the connection. Nginx only passes that on when told to.
    # Without these settings, the connection closes at once. A WebSocket
    # with no messages for an hour is closed, and the website opens it again.
    #
    # The API only accepts a WebSocket from a page on the same site, which it
    # checks by comparing the page's address to the Host header. So Host is
    # passed on as the browser sent it, port included, rather than changed to
    # api:8080.
    location /api/chat/ {
        proxy_pass http://api:8080/chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # HLS files go through the cache, which keeps recent segments in memory
    # and fetches the rest from the API.
    location /hls/ {
        proxy_pass http://cache:8082/hls/;

        # A finished file never changes, so the browser may keep it for a
        # year. Missing files (404) aren't kept, so a video still processing
        # can be fetched again once it's ready.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A live playlist changes every 2 seconds, so the browser must never keep an
    # old copy. A regex location such as this one wins over /hls/ when it
    # matches.
    location ~ ^/hls/.+/live\.m3u8$ {
        proxy_pass http://cache:8082;
        add_header Cache-Control no-cache;
    }
}
