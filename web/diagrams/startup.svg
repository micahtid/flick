<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 196" width="936" height="196" role="img" aria-label="How the site starts">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 12px; fill: #57606a; }
    .folder { font-size: 13px; font-weight: 600; fill: #57606a; text-anchor: start; }
    .web { fill: #ffe3c4; } .p-web { fill: #fff6ec; }
    .nginx { fill: #cdeee8; } .p-nginx { fill: #effaf8; }
    .api { fill: #d8e6ff; } .p-api { fill: #f2f6ff; }
    .queue { fill: #e5dbff; } .p-queue { fill: #f7f3ff; }
    .worker { fill: #d3efdc; } .p-worker { fill: #f0f9f3; }
    .ext { fill: #eaeef2; } .p-ext { fill: #f6f8fa; }
    .ln { fill: none; stroke: #6e7781; stroke-width: 1.6; stroke-linecap: round; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .folder { fill: #c9d1d9; }
      .web { fill: #6b4e30; } .p-web { fill: #3a2e22; }
      .nginx { fill: #2f6158; } .p-nginx { fill: #243b38; }
      .api { fill: #34507e; } .p-api { fill: #263147; }
      .queue { fill: #4f4180; } .p-queue { fill: #312a47; }
      .worker { fill: #326343; } .p-worker { fill: #253a2d; }
      .ext { fill: #3d444d; } .p-ext { fill: #30363d; }
      .ln { stroke: #a0a8b0; }
      .head { fill: #a0a8b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Q2.6 5 1 1.5 Z"/>
    </marker>
  </defs>

  <!-- Lines. Each one is a single straight segment. -->
  <path class="ln" d="M204 98 H260" marker-end="url(#a)"/>
  <path class="ln" d="M440 54 H496" marker-end="url(#a)"/>
  <path class="ln" d="M440 142 H496" marker-end="url(#a)"/>
  <path class="ln" d="M676 54 H732" marker-end="url(#a)"/>
  <path class="ln" d="M676 142 H732" marker-end="url(#a)"/>

  <!-- Boxes -->
  <rect class="web" x="24" y="24" width="180" height="148" rx="10"/><text x="114" y="89">createRoot()</text><text class="sub" x="114" y="107">main.tsx</text>
  <rect class="web" x="260" y="24" width="180" height="148" rx="10"/><text x="350" y="89">App()</text><text class="sub" x="350" y="107">App.tsx</text>
  <rect class="web" x="496" y="24" width="180" height="60" rx="10"/><text x="586" y="45">listVideos()</text><text class="sub" x="586" y="63">api.ts</text>
  <rect class="web" x="496" y="112" width="180" height="60" rx="10"/><text x="586" y="133">useWatchId()</text><text class="sub" x="586" y="151">router.ts</text>
  <rect class="ext" x="732" y="24" width="180" height="60" rx="10"/><text x="822" y="45">GET /api/videos</text><text class="sub" x="822" y="63">Every 3 s While Processing</text>
  <rect class="web" x="732" y="112" width="180" height="60" rx="10"/><text x="822" y="133">Home or Watch Page</text><text class="sub" x="822" y="151">VideoGrid or WatchPage</text>
</svg>
