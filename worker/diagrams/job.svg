<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1472 324" width="1472" height="324" role="img" aria-label="How the worker does a job">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 12px; fill: #57606a; }
    .folder { font-size: 13px; font-weight: 600; fill: #57606a; text-anchor: start; }
    .web { fill: #ffe3c4; } .p-web { fill: #fff6ec; }
    .nginx { fill: #cdeee8; } .p-nginx { fill: #effaf8; }
    .api { fill: #d8e6ff; } .p-api { fill: #f2f6ff; }
    .queue { fill: #e5dbff; } .p-queue { fill: #f7f3ff; }
    .worker { fill: #d3efdc; } .p-worker { fill: #f0f9f3; }
    .storage { fill: #ffd8e4; } .p-storage { fill: #fff3f7; }
    .chunk { fill: #fff1b8; } .p-chunk { fill: #fffbe6; }
    .cache { fill: #e6f2c2; } .p-cache { fill: #f8fbea; }
    .ingest { fill: #f3d7f1; } .p-ingest { fill: #fcf1fb; }
    .metrics { fill: #cdeff7; } .p-metrics { fill: #eefafd; }
    .monitoring { fill: #eadfcf; } .p-monitoring { fill: #f9f5ef; }
    .ext { fill: #eaeef2; } .p-ext { fill: #f6f8fa; }
    .ln { fill: none; stroke: #6e7781; stroke-width: 1.6; stroke-linecap: round; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .folder { fill: #c9d1d9; }
      .web { fill: #6b4e30; } .p-web { fill: #3a2e22; }
      .nginx { fill: #2f6158; } .p-nginx { fill: #243b38; }
      .api { fill: #34507e; } .p-api { fill: #263147; }
      .queue { fill: #4f4180; } .p-queue { fill: #312a47; }
      .worker { fill: #326343; } .p-worker { fill: #253a2d; }
      .storage { fill: #7a3a52; } .p-storage { fill: #3d2630; }
      .chunk { fill: #6b5a1e; } .p-chunk { fill: #3a3320; }
      .cache { fill: #55612a; } .p-cache { fill: #33391f; }
      .ingest { fill: #66395f; } .p-ingest { fill: #39263a; }
      .metrics { fill: #2b5a67; } .p-metrics { fill: #22363c; }
      .monitoring { fill: #5e4c36; } .p-monitoring { fill: #362e25; }
      .ext { fill: #3d444d; } .p-ext { fill: #30363d; }
      .ln { stroke: #a0a8b0; }
      .head { fill: #a0a8b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Q2.6 5 1 1.5 Z"/>
    </marker>
  </defs>

  <!-- Lines. Each one is a single straight segment. -->
  <path class="ln" d="M208 54 H272" marker-end="url(#a)"/>
  <path class="ln" d="M456 54 H520" marker-end="url(#a)"/>
  <path class="ln" d="M704 54 H768" marker-end="url(#a)"/>
  <path class="ln" d="M952 54 H1016" marker-end="url(#a)"/>
  <path class="ln" d="M1200 54 H1264" marker-end="url(#a)"/>
  <path class="ln" d="M116 84 V132" marker-end="url(#a)"/>
  <path class="ln" d="M208 162 H272" marker-end="url(#a)"/>
  <path class="ln" d="M612 84 V240" marker-end="url(#a)"/>
  <path class="ln" d="M704 270 H768" marker-end="url(#a)"/>
  <path class="ln" d="M952 270 H1016" marker-end="url(#a)"/>
  <text class="sub" x="126" y="108" style="text-anchor: start">Starts</text>
  <text class="sub" x="622" y="162" style="text-anchor: start">A Step Fails on the Last Try</text>

  <!-- Boxes -->
  <rect class="worker" x="24" y="24" width="184" height="60" rx="10"/><text x="116" y="45">queueClient.Claim()</text><text class="sub" x="116" y="63">queue.go</text>
  <rect class="worker" x="272" y="24" width="184" height="60" rx="10"/><text x="364" y="45">worker.download()</text><text class="sub" x="364" y="63">worker.go</text>
  <rect class="worker" x="520" y="24" width="184" height="60" rx="10"/><text x="612" y="45">convertToHLS()</text><text class="sub" x="612" y="63">hls.go</text>
  <rect class="worker" x="768" y="24" width="184" height="60" rx="10"/><text x="860" y="45">worker.uploadDir()</text><text class="sub" x="860" y="63">worker.go</text>
  <rect class="worker" x="1016" y="24" width="184" height="60" rx="10"/><text x="1108" y="45">videoStore.MarkReady()</text><text class="sub" x="1108" y="63">db.go</text>
  <rect class="worker" x="1264" y="24" width="184" height="60" rx="10"/><text x="1356" y="45">queueClient.Done()</text><text class="sub" x="1356" y="63">queue.go</text>
  <rect class="worker" x="24" y="132" width="184" height="60" rx="10"/><text x="116" y="153">worker.keepClaim()</text><text class="sub" x="116" y="171">worker.go</text>
  <rect class="worker" x="272" y="132" width="184" height="60" rx="10"/><text x="364" y="153">queueClient.Renew()</text><text class="sub" x="364" y="171">queue.go</text>
  <rect class="worker" x="520" y="240" width="184" height="60" rx="10"/><text x="612" y="261">worker.giveUp()</text><text class="sub" x="612" y="279">worker.go</text>
  <rect class="worker" x="768" y="240" width="184" height="60" rx="10"/><text x="860" y="261">videoStore.MarkFailed()</text><text class="sub" x="860" y="279">db.go</text>
  <rect class="worker" x="1016" y="240" width="184" height="60" rx="10"/><text x="1108" y="261">queueClient.Done()</text><text class="sub" x="1108" y="279">queue.go</text>
</svg>
