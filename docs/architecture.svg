<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="Flick architecture">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 12px; fill: #59636e; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .ext { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .node { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
    .group { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .ln { fill: none; stroke: #818b98; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .raft { fill: none; stroke: #54aeff; stroke-width: 1.6; stroke-dasharray: 2 5; stroke-linecap: round; }
    .head { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .ext { fill: #212830; stroke: #3d444d; }
      .node { fill: #0c2d6b; stroke: #4493f8; }
      .group { fill: #0d1117; stroke: #3d444d; }
      .ln { stroke: #656c76; }
      .raft { stroke: #4493f8; }
      .head { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Q2.6 5 1 1.5 Z"/>
    </marker>
  </defs>

  <!-- Lines (drawn first so boxes sit on top) -->
  <path class="ln" d="M195 72 V118" marker-end="url(#a)"/>
  <path class="ln" d="M195 172 V195 Q195 211 179 211 H116 Q100 211 100 227 V248" marker-end="url(#a)"/>
  <path class="ln" d="M195 195 Q195 211 211 211 H274 Q290 211 290 227 V248" marker-end="url(#a)"/>
  <path class="ln" d="M860 72 V248" marker-end="url(#a)"/>
  <path class="ln" d="M365 276 H403" marker-end="url(#a)"/>
  <path class="ln" d="M555 276 H593" marker-end="url(#a)"/>
  <path class="ln" d="M310 302 V320 Q310 336 326 336 H564 Q580 336 580 352 V368" marker-end="url(#a)"/>
  <path class="ln" d="M424 336 Q440 336 440 352 V368" marker-end="url(#a)"/>
  <path class="ln" d="M100 302 V468" marker-end="url(#a)"/>
  <path class="ln" d="M265 302 V468" marker-end="url(#a)"/>
  <path class="ln" d="M670 302 V468" marker-end="url(#a)"/>
  <path class="ln" d="M860 302 V468" marker-end="url(#a)"/>

  <text class="sub" x="148" y="198">Video</text>
  <text class="sub" x="242" y="198">API</text>
  <text class="sub" x="884" y="160">RTMP</text>

  <!-- Clients -->
  <rect class="ext" x="120" y="20" width="150" height="52" rx="26"/><text x="195" y="46">Viewer</text>
  <rect class="ext" x="785" y="20" width="150" height="52" rx="26"/><text x="860" y="46">OBS Studio</text>

  <!-- Entry -->
  <rect class="box" x="120" y="120" width="150" height="52" rx="12"/><text x="195" y="146">Nginx</text>

  <!-- Services -->
  <rect class="box" x="25"  y="250" width="150" height="52" rx="12"/><text x="100" y="276">Edge Cache</text>
  <rect class="box" x="215" y="250" width="150" height="52" rx="12"/><text x="290" y="276">API Gateway</text>
  <rect class="box" x="405" y="250" width="150" height="52" rx="12"/><text x="480" y="276">Job Queue</text>
  <rect class="box" x="595" y="250" width="150" height="52" rx="12"/><text x="670" y="276">Workers</text>
  <rect class="box" x="785" y="250" width="150" height="52" rx="12"/><text x="860" y="276">Live Ingest</text>

  <!-- Data -->
  <rect class="box" x="380" y="370" width="120" height="52" rx="12"/><text x="440" y="396">Postgres</text>
  <rect class="box" x="520" y="370" width="120" height="52" rx="12"/><text x="580" y="396">Redis</text>

  <!-- Chunk Store -->
  <rect class="group" x="20" y="470" width="920" height="120" rx="18"/>
  <text x="480" y="492">Chunk Store</text>
  <path class="raft" d="M294 536 H386"/>
  <path class="raft" d="M574 536 H666"/>
  <text class="sub" x="340" y="522">Raft</text>
  <text class="sub" x="620" y="522">Raft</text>
  <rect class="node" x="110" y="510" width="180" height="52" rx="12"/><text x="200" y="528">Node 1</text><text class="sub" x="200" y="547">Leader</text>
  <rect class="node" x="390" y="510" width="180" height="52" rx="12"/><text x="480" y="528">Node 2</text><text class="sub" x="480" y="547">Follower</text>
  <rect class="node" x="670" y="510" width="180" height="52" rx="12"/><text x="760" y="528">Node 3</text><text class="sub" x="760" y="547">Follower</text>
</svg>
