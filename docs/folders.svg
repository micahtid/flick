<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1308 1168" width="1308" height="1168" role="img" aria-label="How Flick&#x27;s folders and files connect">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 12px; fill: #57606a; }
    .folder { font-size: 13px; font-weight: 600; fill: #57606a; text-anchor: start; }
    .web { fill: #ffe3c4; } .p-web { fill: #fff6ec; }
    .nginx { fill: #cdeee8; } .p-nginx { fill: #effaf8; }
    .api { fill: #d8e6ff; } .p-api { fill: #f2f6ff; }
    .queue { fill: #e5dbff; } .p-queue { fill: #f7f3ff; }
    .worker { fill: #d3efdc; } .p-worker { fill: #f0f9f3; }
    .storage { fill: #ffd8e4; } .p-storage { fill: #fff3f7; }
    .chunk { fill: #fff1b8; } .p-chunk { fill: #fffbe6; }
    .cache { fill: #e6f2c2; } .p-cache { fill: #f8fbea; }
    .ext { fill: #eaeef2; } .p-ext { fill: #f6f8fa; }
    .ln { fill: none; stroke: #6e7781; stroke-width: 1.6; stroke-linecap: round; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .folder { fill: #c9d1d9; }
      .web { fill: #6b4e30; } .p-web { fill: #3a2e22; }
      .nginx { fill: #2f6158; } .p-nginx { fill: #243b38; }
      .api { fill: #34507e; } .p-api { fill: #263147; }
      .queue { fill: #4f4180; } .p-queue { fill: #312a47; }
      .worker { fill: #326343; } .p-worker { fill: #253a2d; }
      .storage { fill: #7a3a52; } .p-storage { fill: #3d2630; }
      .chunk { fill: #6b5a1e; } .p-chunk { fill: #3a3320; }
      .cache { fill: #55612a; } .p-cache { fill: #33391f; }
      .ext { fill: #3d444d; } .p-ext { fill: #30363d; }
      .ln { stroke: #a0a8b0; }
      .head { fill: #a0a8b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Q2.6 5 1 1.5 Z"/>
    </marker>
  </defs>

  <!-- Folders (drawn first so everything else sits on top) -->
  <rect class="p-web" x="91" y="24" width="248" height="136" rx="14"/><text class="folder" x="109" y="48">web/</text>
  <rect class="p-nginx" x="91" y="224" width="248" height="136" rx="14"/><text class="folder" x="109" y="248">nginx/</text>
  <rect class="p-cache" x="189" y="424" width="198" height="136" rx="14"/><text class="folder" x="207" y="448">cache/</text>
  <rect class="p-api" x="24" y="624" width="390" height="280" rx="14"/><text class="folder" x="42" y="648">api/</text>
  <rect class="p-queue" x="555" y="768" width="198" height="256" rx="14"/><text class="folder" x="573" y="792">queue/</text>
  <rect class="p-worker" x="894" y="624" width="390" height="280" rx="14"/><text class="folder" x="912" y="648">worker/</text>
  <rect class="p-storage" x="531" y="224" width="246" height="136" rx="14"/><text class="folder" x="549" y="248">storage/</text>
  <rect class="p-chunk" x="555" y="624" width="198" height="132" rx="14"/><text class="folder" x="573" y="648">pkg/chunk/</text>

  <!-- Lines. Each one is a single straight segment. -->
  <path class="ln" d="M215 132 V276" marker-end="url(#a)"/>
  <path class="ln" d="M150 332 V676" marker-end="url(#a)"/>
  <path class="ln" d="M288 332 V476" marker-end="url(#a)"/>
  <path class="ln" d="M288 532 V676" marker-end="url(#a)"/>
  <path class="ln" d="M390 704 H579" marker-end="url(#a)"/>
  <path class="ln" d="M918 704 H729" marker-end="url(#a)"/>
  <path class="ln" d="M126 732 V820" marker-end="url(#a)"/>
  <path class="ln" d="M312 732 V820" marker-end="url(#a)"/>
  <path class="ln" d="M996 732 V820" marker-end="url(#a)"/>
  <path class="ln" d="M1182 732 V820" marker-end="url(#a)"/>
  <path class="ln" d="M390 848 H579" marker-end="url(#a)"/>
  <path class="ln" d="M918 848 H729" marker-end="url(#a)"/>
  <path class="ln" d="M654 876 V940" marker-end="url(#a)"/>
  <path class="ln" d="M654 676 V332" marker-end="url(#a)"/>
  <path class="ln" d="M126 876 V1088" marker-end="url(#a)"/>
  <path class="ln" d="M654 996 V1088" marker-end="url(#a)"/>
  <path class="ln" d="M1182 876 V1088" marker-end="url(#a)"/>
  <text class="sub" x="225" y="192" style="text-anchor: start">HTTP</text>
  <text class="sub" x="140" y="392" style="text-anchor: end">/api</text>
  <text class="sub" x="298" y="392" style="text-anchor: start">/hls</text>
  <text class="sub" x="298" y="592" style="text-anchor: start">Fetches Files</text>
  <text class="sub" x="484.5" y="690">Saves and Reads Files</text>
  <text class="sub" x="823.5" y="690">Saves and Reads Files</text>
  <text class="sub" x="664" y="492" style="text-anchor: start">Sends Chunks and Map Changes</text>
  <text class="sub" x="484.5" y="834">Adds Jobs</text>
  <text class="sub" x="823.5" y="834">Claims Jobs</text>
  <text class="sub" x="136" y="996" style="text-anchor: start">videos Table</text>
  <text class="sub" x="664" y="1056" style="text-anchor: start">jobs Table</text>
  <text class="sub" x="1172" y="996" style="text-anchor: end">Marks Videos Ready</text>

  <!-- Boxes -->
  <rect class="web" x="115" y="76" width="200" height="56" rx="10"/><text x="215" y="95">api.ts, Player.tsx</text><text class="sub" x="215" y="113">Uploads, lists and plays.</text>
  <rect class="nginx" x="115" y="276" width="200" height="56" rx="10"/><text x="215" y="295">nginx.conf</text><text class="sub" x="215" y="313">Forwards /api and /hls.</text>
  <rect class="cache" x="213" y="476" width="150" height="56" rx="10"/><text x="288" y="495">lru.go, hls.go</text><text class="sub" x="288" y="513">Keeps recent segments.</text>
  <rect class="api" x="48" y="676" width="342" height="56" rx="10"/><text x="219" y="695">videos.go</text><text class="sub" x="219" y="713">Handles each request.</text>
  <rect class="api" x="48" y="820" width="156" height="56" rx="10"/><text x="126" y="839">db.go</text><text class="sub" x="126" y="857">videoStore</text>
  <rect class="api" x="234" y="820" width="156" height="56" rx="10"/><text x="312" y="839">queue.go</text><text class="sub" x="312" y="857">queueClient</text>
  <rect class="storage" x="555" y="276" width="198" height="56" rx="10"/><text x="654" y="295">chunks.go, cluster.go</text><text class="sub" x="654" y="313">Saves chunks and shares a map.</text>
  <rect class="chunk" x="579" y="676" width="150" height="56" rx="10"/><text x="654" y="695">chunk.go, files.go</text><text class="sub" x="654" y="713">Splits and joins files.</text>
  <rect class="queue" x="579" y="820" width="150" height="56" rx="10"/><text x="654" y="839">jobs.go</text><text class="sub" x="654" y="857">Hands out jobs.</text>
  <rect class="queue" x="579" y="940" width="150" height="56" rx="10"/><text x="654" y="959">db.go</text><text class="sub" x="654" y="977">jobStore</text>
  <rect class="worker" x="918" y="676" width="342" height="56" rx="10"/><text x="1089" y="695">worker.go, hls.go</text><text class="sub" x="1089" y="713">Converts to HLS with FFmpeg.</text>
  <rect class="worker" x="918" y="820" width="156" height="56" rx="10"/><text x="996" y="839">queue.go</text><text class="sub" x="996" y="857">queueClient</text>
  <rect class="worker" x="1104" y="820" width="156" height="56" rx="10"/><text x="1182" y="839">db.go</text><text class="sub" x="1182" y="857">videoStore</text>
  <rect class="ext" x="48" y="1088" width="1212" height="56" rx="10"/><text x="654" y="1107">Postgres</text><text class="sub" x="654" y="1125">videos, jobs and files tables</text>
</svg>
