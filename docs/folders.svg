<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1304" width="1480" height="1304" role="img" aria-label="How Flick&#x27;s folders and files connect">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 12px; fill: #57606a; }
    .folder { font-size: 13px; font-weight: 600; fill: #57606a; text-anchor: start; }
    .web { fill: #ffe3c4; } .p-web { fill: #fff6ec; }
    .nginx { fill: #cdeee8; } .p-nginx { fill: #effaf8; }
    .api { fill: #d8e6ff; } .p-api { fill: #f2f6ff; }
    .queue { fill: #e5dbff; } .p-queue { fill: #f7f3ff; }
    .worker { fill: #d3efdc; } .p-worker { fill: #f0f9f3; }
    .storage { fill: #ffd8e4; } .p-storage { fill: #fff3f7; }
    .chunk { fill: #fff1b8; } .p-chunk { fill: #fffbe6; }
    .cache { fill: #e6f2c2; } .p-cache { fill: #f8fbea; }
    .ingest { fill: #f3d7f1; } .p-ingest { fill: #fcf1fb; }
    .metrics { fill: #cdeff7; } .p-metrics { fill: #eefafd; }
    .monitoring { fill: #eadfcf; } .p-monitoring { fill: #f9f5ef; }
    .ext { fill: #eaeef2; } .p-ext { fill: #f6f8fa; }
    .group { fill: #f3f4f6; }
    .ln { fill: none; stroke: #6e7781; stroke-width: 1.6; stroke-linecap: round; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .folder { fill: #c9d1d9; }
      .web { fill: #6b4e30; } .p-web { fill: #3a2e22; }
      .nginx { fill: #2f6158; } .p-nginx { fill: #243b38; }
      .api { fill: #34507e; } .p-api { fill: #263147; }
      .queue { fill: #4f4180; } .p-queue { fill: #312a47; }
      .worker { fill: #326343; } .p-worker { fill: #253a2d; }
      .storage { fill: #7a3a52; } .p-storage { fill: #3d2630; }
      .chunk { fill: #6b5a1e; } .p-chunk { fill: #3a3320; }
      .cache { fill: #55612a; } .p-cache { fill: #33391f; }
      .ingest { fill: #66395f; } .p-ingest { fill: #39263a; }
      .metrics { fill: #2b5a67; } .p-metrics { fill: #22363c; }
      .monitoring { fill: #5e4c36; } .p-monitoring { fill: #362e25; }
      .ext { fill: #3d444d; } .p-ext { fill: #30363d; }
      .group { fill: #161b22; }
      .ln { stroke: #a0a8b0; }
      .head { fill: #a0a8b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Q2.6 5 1 1.5 Z"/>
    </marker>
  </defs>

  <!-- Folders (drawn first so everything else sits on top) -->
  <rect class="group" x="24" y="24" width="400" height="116" rx="14"/><text class="folder" x="42" y="46">web/</text>
  <rect class="group" x="24" y="212" width="400" height="116" rx="14"/><text class="folder" x="42" y="234">nginx/</text>
  <rect class="group" x="544" y="212" width="240" height="116" rx="14"/><text class="folder" x="562" y="234">storage/</text>
  <rect class="group" x="204" y="400" width="220" height="116" rx="14"/><text class="folder" x="222" y="422">cache/</text>
  <rect class="group" x="904" y="400" width="552" height="116" rx="14"/><text class="folder" x="922" y="422">ingest/</text>
  <rect class="group" x="544" y="400" width="240" height="304" rx="14"/><text class="folder" x="562" y="422">pkg/chunk/</text>
  <rect class="group" x="24" y="588" width="400" height="280" rx="14"/><text class="folder" x="42" y="610">api/</text>
  <rect class="group" x="904" y="588" width="392" height="280" rx="14"/><text class="folder" x="922" y="610">worker/</text>
  <rect class="group" x="544" y="752" width="240" height="220" rx="14"/><text class="folder" x="562" y="774">queue/</text>
  <rect class="group" x="24" y="1164" width="400" height="116" rx="14"/><text class="folder" x="42" y="1186">pkg/metrics/</text>
  <rect class="group" x="544" y="1164" width="912" height="116" rx="14"/><text class="folder" x="562" y="1186">monitoring/</text>

  <!-- Lines. A label breaks its line and sits in the middle of it. -->
  <path class="ln" d="M96 684 V792" marker-end="url(#a)"/>
  <path class="ln" d="M224 684 V792" marker-end="url(#a)"/>
  <path class="ln" d="M352 684 V792" marker-end="url(#a)"/>
  <path class="ln" d="M1006 684 V792" marker-end="url(#a)"/>
  <path class="ln" d="M1194 684 V792" marker-end="url(#a)"/>
  <path class="ln" d="M664 848 V896" marker-end="url(#a)"/>
  <path class="ln" d="M224 120 V162"/>
  <path class="ln" d="M224 190 V252" marker-end="url(#a)"/>
  <path class="ln" d="M96 308 V444"/>
  <path class="ln" d="M96 472 V628" marker-end="url(#a)"/>
  <path class="ln" d="M314 308 V350"/>
  <path class="ln" d="M314 378 V440" marker-end="url(#a)"/>
  <path class="ln" d="M314 496 V538"/>
  <path class="ln" d="M314 566 V628" marker-end="url(#a)"/>
  <path class="ln" d="M664 440 V378"/>
  <path class="ln" d="M664 350 V308" marker-end="url(#a)"/>
  <path class="ln" d="M1100 308 V350"/>
  <path class="ln" d="M1100 378 V440" marker-end="url(#a)"/>
  <path class="ln" d="M1276 468 H1316" marker-end="url(#a)"/>
  <path class="ln" d="M924 468 H871"/>
  <path class="ln" d="M817 468 H764" marker-end="url(#a)"/>
  <path class="ln" d="M404 656 H423"/>
  <path class="ln" d="M545 656 H564" marker-end="url(#a)"/>
  <path class="ln" d="M924 656 H905"/>
  <path class="ln" d="M783 656 H764" marker-end="url(#a)"/>
  <path class="ln" d="M404 820 H443.4"/>
  <path class="ln" d="M524.6 820 H564" marker-end="url(#a)"/>
  <path class="ln" d="M924 820 H891.4"/>
  <path class="ln" d="M796.6 820 H764" marker-end="url(#a)"/>
  <path class="ln" d="M224 848 V882"/>
  <path class="ln" d="M224 910 V924" marker-end="url(#a)"/>
  <path class="ln" d="M96 848 V938"/>
  <path class="ln" d="M96 966 V1036" marker-end="url(#a)"/>
  <path class="ln" d="M664 952 V990"/>
  <path class="ln" d="M664 1018 V1036" marker-end="url(#a)"/>
  <path class="ln" d="M1194 848 V938"/>
  <path class="ln" d="M1194 966 V1036" marker-end="url(#a)"/>
  <path class="ln" d="M1376 496 V762"/>
  <path class="ln" d="M1376 790 V1036" marker-end="url(#a)"/>
  <path class="ln" d="M564 1232 H541.6"/>
  <path class="ln" d="M426.4 1232 H404" marker-end="url(#a)"/>
  <path class="ln" d="M1136 1232 H1033.8"/>
  <path class="ln" d="M966.2 1232 H864" marker-end="url(#a)"/>
  <text class="sub" x="224" y="176">HTTP</text>
  <text class="sub" x="96" y="458">/api</text>
  <text class="sub" x="314" y="364">/hls</text>
  <text class="sub" x="314" y="552">Fetches</text>
  <text class="sub" x="664" y="364">Chunks and Map Changes</text>
  <text class="sub" x="1100" y="364">RTMP</text>
  <text class="sub" x="844" y="468">Saves</text>
  <text class="sub" x="484" y="656">Saves and Reads</text>
  <text class="sub" x="844" y="656">Saves and Reads</text>
  <text class="sub" x="484" y="820">Adds Jobs</text>
  <text class="sub" x="844" y="820">Claims Jobs</text>
  <text class="sub" x="224" y="896">Messages</text>
  <text class="sub" x="96" y="952">videos</text>
  <text class="sub" x="664" y="1004">jobs</text>
  <text class="sub" x="1194" y="952">videos</text>
  <text class="sub" x="1376" y="776">videos</text>
  <text class="sub" x="484" y="1232">Reads /metrics</text>
  <text class="sub" x="1000" y="1232">Queries</text>

  <!-- Boxes -->
  <rect class="web" x="44" y="64" width="360" height="56" rx="10"/><text x="224" y="83">api.ts, Player.tsx</text><text class="sub" x="224" y="101">Uploads, plays, chats and counts.</text>
  <rect class="nginx" x="44" y="252" width="360" height="56" rx="10"/><text x="224" y="271">nginx.conf</text><text class="sub" x="224" y="289">Forwards /api and /hls.</text>
  <rect class="storage" x="564" y="252" width="200" height="56" rx="10"/><text x="664" y="271">chunks.go, cluster.go</text><text class="sub" x="664" y="289">Saves chunks and shares a map.</text>
  <rect class="cache" x="224" y="440" width="180" height="56" rx="10"/><text x="314" y="459">lru.go, hls.go</text><text class="sub" x="314" y="477">Keeps recent segments.</text>
  <rect class="ingest" x="924" y="440" width="352" height="56" rx="10"/><text x="1100" y="459">stream.go, hls.go</text><text class="sub" x="1100" y="477">Converts and saves each segment.</text>
  <rect class="ingest" x="1316" y="440" width="120" height="56" rx="10"/><text x="1376" y="459">db.go</text><text class="sub" x="1376" y="477">videoStore</text>
  <rect class="ext" x="1000" y="252" width="200" height="56" rx="10"/><text x="1100" y="271">OBS Studio</text><text class="sub" x="1100" y="289">Sends the stream.</text>
  <rect class="chunk" x="564" y="440" width="200" height="244" rx="10"/><text x="664" y="553">chunk.go, files.go</text><text class="sub" x="664" y="571">Splits and joins files.</text>
  <rect class="api" x="44" y="628" width="360" height="56" rx="10"/><text x="224" y="647">videos.go, views.go</text><text class="sub" x="224" y="665">Handles each request.</text>
  <rect class="api" x="44" y="792" width="104" height="56" rx="10"/><text x="96" y="811">db.go</text><text class="sub" x="96" y="829">videoStore</text>
  <rect class="api" x="172" y="792" width="104" height="56" rx="10"/><text x="224" y="811">chat.go</text><text class="sub" x="224" y="829">redisHub</text>
  <rect class="api" x="300" y="792" width="104" height="56" rx="10"/><text x="352" y="811">queue.go</text><text class="sub" x="352" y="829">queueClient</text>
  <rect class="worker" x="924" y="628" width="352" height="56" rx="10"/><text x="1100" y="647">worker.go, hls.go</text><text class="sub" x="1100" y="665">Converts to HLS with FFmpeg.</text>
  <rect class="worker" x="924" y="792" width="164" height="56" rx="10"/><text x="1006" y="811">queue.go</text><text class="sub" x="1006" y="829">queueClient</text>
  <rect class="worker" x="1112" y="792" width="164" height="56" rx="10"/><text x="1194" y="811">db.go</text><text class="sub" x="1194" y="829">videoStore</text>
  <rect class="queue" x="564" y="792" width="200" height="56" rx="10"/><text x="664" y="811">jobs.go</text><text class="sub" x="664" y="829">Hands out jobs.</text>
  <rect class="queue" x="564" y="896" width="200" height="56" rx="10"/><text x="664" y="915">db.go</text><text class="sub" x="664" y="933">jobStore</text>
  <rect class="ext" x="152" y="924" width="144" height="56" rx="10"/><text x="224" y="943">Redis</text><text class="sub" x="224" y="961">chat:&lt;id&gt; channels</text>
  <rect class="ext" x="44" y="1036" width="1392" height="56" rx="10"/><text x="740" y="1055">Postgres</text><text class="sub" x="740" y="1073">videos, jobs and files tables</text>
  <rect class="metrics" x="44" y="1204" width="360" height="56" rx="10"/><text x="224" y="1223">metrics.go</text><text class="sub" x="224" y="1241">Counts every request.</text>
  <rect class="monitoring" x="564" y="1204" width="300" height="56" rx="10"/><text x="714" y="1223">prometheus.yml</text><text class="sub" x="714" y="1241">Prometheus reads every 15 seconds.</text>
  <rect class="monitoring" x="1136" y="1204" width="300" height="56" rx="10"/><text x="1286" y="1223">dashboards/flick.json</text><text class="sub" x="1286" y="1241">Grafana draws the dashboard.</text>
</svg>
