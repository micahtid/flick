# `docker compose up --build` starts the Phase 3 stack (db, api, queue,
# worker, nginx). Add `--scale worker=2` to run two workers.
# `docker compose --profile full up --build` starts all 13 containers.

x-storage: &storage
  build: ./storage
  profiles: [full]

services:
  # Phase 1
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: flick
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
      QUEUE_URL: http://queue:8081
    ports: ["8080:8080"]
    volumes:
      - uploads:/data
    depends_on: [db, queue]

  # Phase 3 gives Nginx the uploads volume, read only (ro), so it can serve
  # the HLS files the workers write to /data/hls.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports: ["80:80"]
    volumes:
      - uploads:/data:ro
    depends_on: [api]

  # Phase 2
  queue:
    build: ./queue
    environment:
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
    ports: ["8081:8081"]
    depends_on: [db]

  # One service, so Compose can start as many copies as `--scale` asks for.
  # Each copy shares the uploads volume with the API, so it can read uploads
  # and save HLS files in /data/hls for Nginx to serve.
  worker:
    build: ./worker
    environment:
      QUEUE_URL: http://queue:8081
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
    volumes:
      - uploads:/data
    depends_on: [queue, db]

  # Later phases
  redis:
    image: redis:7
    profiles: [full]
    ports: ["6379:6379"]

  cache:
    build: ./cache
    profiles: [full]
    ports: ["8082:8082"]

  ingest:
    build: ./ingest
    profiles: [full]
    ports: ["1935:1935"]

  node1:
    <<: *storage
    environment: { NODE_ID: node1, PORT: "9001" }
    ports: ["9001:9001"]
  node2:
    <<: *storage
    environment: { NODE_ID: node2, PORT: "9002" }
    ports: ["9002:9002"]
  node3:
    <<: *storage
    environment: { NODE_ID: node3, PORT: "9003" }
    ports: ["9003:9003"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [full]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [full]
    ports: ["3001:3000"]  # 3000 is often taken on this machine
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on: [prometheus]

volumes:
  dbdata:
  uploads:
