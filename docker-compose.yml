# `docker compose up --build` starts all 13 containers: db, api, queue,
# worker, nginx, three storage nodes, the cache, Redis, the ingest service,
# Prometheus and Grafana. Add `--scale worker=2` to run two workers.

# This lists the storage nodes. The API, the worker, the ingest service and
# the nodes themselves all read it, so it's written once here.
x-storage-nodes: &storage-nodes http://node1:9001,http://node2:9002,http://node3:9003

# Every storage node is built the same way. Each one sets its own name,
# published port and volume below, and node1 also sets BOOTSTRAP.
x-storage: &storage
  build: { context: ., dockerfile: storage/Dockerfile }

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: flick
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data

  # Every Go service builds from the project folder, so it can use the shared
  # packages in pkg/chunk and pkg/metrics.
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
      QUEUE_URL: http://queue:8081
      STORAGE_NODES: *storage-nodes
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on: [db, queue, node1, node2, node3, redis]

  # Nginx sends /hls requests to the cache, which fetches any file it doesn't
  # have from the API.
  nginx:
    build: { context: ., dockerfile: nginx/Dockerfile }
    ports: ["80:80"]
    depends_on: [api, cache]

  queue:
    build: { context: ., dockerfile: queue/Dockerfile }
    environment:
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
    ports: ["8081:8081"]
    depends_on: [db]

  # The worker is one service, so Compose can start as many copies as
  # `--scale` asks for. Each copy reads uploads from the storage nodes and
  # saves HLS files back. Prometheus finds every copy, and reads its numbers on
  # port 8090.
  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    environment:
      QUEUE_URL: http://queue:8081
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
      STORAGE_NODES: *storage-nodes
    depends_on: [queue, db, node1, node2, node3]

  # Each node has its own volume, which acts like its own disk. The nodes also
  # talk to each other with Raft, on ports 10001 to 10003. node1 sets up the
  # cluster the first time it starts.
  node1:
    <<: *storage
    environment: { NODE_ID: node1, STORAGE_NODES: *storage-nodes, BOOTSTRAP: "true" }
    ports: ["9001:9001"]
    volumes: [node1data:/chunks]
  node2:
    <<: *storage
    environment: { NODE_ID: node2, STORAGE_NODES: *storage-nodes }
    ports: ["9002:9002"]
    volumes: [node2data:/chunks]
  node3:
    <<: *storage
    environment: { NODE_ID: node3, STORAGE_NODES: *storage-nodes }
    ports: ["9003:9003"]
    volumes: [node3data:/chunks]

  # The cache keeps up to CACHE_MAX_MB of segments in memory, so changing the
  # limit needs only a restart, not a rebuild.
  cache:
    build: { context: ., dockerfile: cache/Dockerfile }
    environment:
      API_URL: http://api:8080
      CACHE_MAX_MB: "500"
    ports: ["8082:8082"]
    depends_on: [api]

  # Redis passes each chat message to every copy of the API.
  redis:
    image: redis:7
    ports: ["6379:6379"]

  # The ingest service takes streams from OBS on port 1935, and saves them on
  # the storage nodes. It also needs the API, which creates the videos and
  # files tables. Prometheus reads its numbers on port 8083.
  ingest:
    build: { context: ., dockerfile: ingest/Dockerfile }
    environment:
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
      STORAGE_NODES: *storage-nodes
    ports: ["1935:1935"]
    depends_on: [db, api, node1, node2, node3]

  # Prometheus reads /metrics from every service every 15 seconds. Grafana draws
  # the numbers on a dashboard, which it loads from monitoring/grafana/ when it
  # starts.
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3001:3000"]  # Port 3000 is often taken on this machine, so use 3001.
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  dbdata:
  node1data:
  node2data:
  node3data:
