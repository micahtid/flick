# `docker compose up --build` starts the Phase 6 stack (db, api, queue,
# worker, nginx, three storage nodes, and the cache). Add `--scale worker=2`
# to run two workers. `docker compose --profile full up --build` starts all 13
# containers.

# This lists the storage nodes. The API, the worker and the nodes themselves
# all read it, so it's written once here.
x-storage-nodes: &storage-nodes http://node1:9001,http://node2:9002,http://node3:9003

# Every storage node is built the same way. Each one sets its own name,
# published port and volume below, and node1 also sets BOOTSTRAP.
x-storage: &storage
  build: ./storage

services:
  # These services start in Phase 1.
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: flick
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data

  # Phase 4 builds the API and worker from the project folder, so they can
  # use the shared pkg/chunk package.
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
      QUEUE_URL: http://queue:8081
      STORAGE_NODES: *storage-nodes
    ports: ["8080:8080"]
    depends_on: [db, queue, node1, node2, node3]

  # Nginx sends /hls requests to the cache, which fetches any file it doesn't
  # have from the API.
  nginx:
    build: { context: ., dockerfile: nginx/Dockerfile }
    ports: ["80:80"]
    depends_on: [api, cache]

  # These services start in Phase 2.
  queue:
    build: ./queue
    environment:
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
    ports: ["8081:8081"]
    depends_on: [db]

  # This is one service, so Compose can start as many copies as `--scale` asks for.
  # Each copy reads uploads from the storage nodes and saves HLS files back.
  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    environment:
      QUEUE_URL: http://queue:8081
      DATABASE_URL: postgres://postgres:flick@db:5432/postgres?sslmode=disable
      STORAGE_NODES: *storage-nodes
    depends_on: [queue, db, node1, node2, node3]

  # These services start in Phase 4. Each node has its own volume, which acts
  # like its own disk. In Phase 5 the nodes also talk to each other with Raft,
  # on ports 10001 to 10003. node1 sets up the cluster the first time it starts.
  node1:
    <<: *storage
    environment: { NODE_ID: node1, STORAGE_NODES: *storage-nodes, BOOTSTRAP: "true" }
    ports: ["9001:9001"]
    volumes: [node1data:/chunks]
  node2:
    <<: *storage
    environment: { NODE_ID: node2, STORAGE_NODES: *storage-nodes }
    ports: ["9002:9002"]
    volumes: [node2data:/chunks]
  node3:
    <<: *storage
    environment: { NODE_ID: node3, STORAGE_NODES: *storage-nodes }
    ports: ["9003:9003"]
    volumes: [node3data:/chunks]

  # This service starts in Phase 6. It keeps up to CACHE_MAX_MB of segments
  # in memory, so changing the limit needs only a restart, not a rebuild.
  cache:
    build: ./cache
    environment:
      API_URL: http://api:8080
      CACHE_MAX_MB: "500"
    ports: ["8082:8082"]
    depends_on: [api]

  # These services are for later phases. They only start with `--profile full`.
  redis:
    image: redis:7
    profiles: [full]
    ports: ["6379:6379"]

  ingest:
    build: ./ingest
    profiles: [full]
    ports: ["1935:1935"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [full]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [full]
    ports: ["3001:3000"]  # Port 3000 is often taken on this machine, so use 3001.
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on: [prometheus]

volumes:
  dbdata:
  node1data:
  node2data:
  node3data:
