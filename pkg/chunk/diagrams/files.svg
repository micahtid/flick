<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="How a file is saved and read">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 12px; fill: #57606a; }
    .folder { font-size: 13px; font-weight: 600; fill: #57606a; text-anchor: start; }
    .web { fill: #ffe3c4; } .p-web { fill: #fff6ec; }
    .nginx { fill: #cdeee8; } .p-nginx { fill: #effaf8; }
    .api { fill: #d8e6ff; } .p-api { fill: #f2f6ff; }
    .queue { fill: #e5dbff; } .p-queue { fill: #f7f3ff; }
    .worker { fill: #d3efdc; } .p-worker { fill: #f0f9f3; }
    .storage { fill: #ffd8e4; } .p-storage { fill: #fff3f7; }
    .chunk { fill: #fff1b8; } .p-chunk { fill: #fffbe6; }
    .ext { fill: #eaeef2; } .p-ext { fill: #f6f8fa; }
    .ln { fill: none; stroke: #6e7781; stroke-width: 1.6; stroke-linecap: round; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .folder { fill: #c9d1d9; }
      .web { fill: #6b4e30; } .p-web { fill: #3a2e22; }
      .nginx { fill: #2f6158; } .p-nginx { fill: #243b38; }
      .api { fill: #34507e; } .p-api { fill: #263147; }
      .queue { fill: #4f4180; } .p-queue { fill: #312a47; }
      .worker { fill: #326343; } .p-worker { fill: #253a2d; }
      .storage { fill: #7a3a52; } .p-storage { fill: #3d2630; }
      .chunk { fill: #6b5a1e; } .p-chunk { fill: #3a3320; }
      .ext { fill: #3d444d; } .p-ext { fill: #30363d; }
      .ln { stroke: #a0a8b0; }
      .head { fill: #a0a8b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Q2.6 5 1 1.5 Z"/>
    </marker>
  </defs>

  <!-- Lines. Each one is a single straight segment. -->
  <path class="ln" d="M204 98 H268" marker-end="url(#a)"/>
  <path class="ln" d="M448 54 H512" marker-end="url(#a)"/>
  <path class="ln" d="M448 142 H512" marker-end="url(#a)"/>
  <path class="ln" d="M692 54 H756" marker-end="url(#a)"/>
  <path class="ln" d="M692 142 H756" marker-end="url(#a)"/>
  <path class="ln" d="M204 274 H268" marker-end="url(#a)"/>
  <path class="ln" d="M448 230 H512" marker-end="url(#a)"/>
  <path class="ln" d="M602 260 V288" marker-end="url(#a)"/>
  <path class="ln" d="M692 230 H756" marker-end="url(#a)"/>
  <path class="ln" d="M692 318 H756" marker-end="url(#a)"/>

  <!-- Boxes -->
  <rect class="chunk" x="24" y="24" width="180" height="148" rx="10"/><text x="114" y="89">Store.Save()</text><text class="sub" x="114" y="107">files.go</text>
  <rect class="chunk" x="268" y="24" width="180" height="148" rx="10"/><text x="358" y="89">Client.Put()</text><text class="sub" x="358" y="107">chunk.go</text>
  <rect class="chunk" x="512" y="24" width="180" height="60" rx="10"/><text x="602" y="45">Client.writeAll()</text><text class="sub" x="602" y="63">chunk.go</text>
  <rect class="chunk" x="512" y="112" width="180" height="60" rx="10"/><text x="602" y="133">Client.record()</text><text class="sub" x="602" y="151">chunk.go</text>
  <rect class="storage" x="756" y="24" width="180" height="324" rx="10"/><text x="846" y="177">Storage Nodes</text><text class="sub" x="846" y="195">node1, node2, node3</text>
  <rect class="chunk" x="24" y="200" width="180" height="148" rx="10"/><text x="114" y="265">Store.Copy()</text><text class="sub" x="114" y="283">files.go</text>
  <rect class="chunk" x="268" y="200" width="180" height="148" rx="10"/><text x="358" y="265">Client.Get()</text><text class="sub" x="358" y="283">chunk.go</text>
  <rect class="chunk" x="512" y="200" width="180" height="60" rx="10"/><text x="602" y="221">Client.readAny()</text><text class="sub" x="602" y="239">chunk.go</text>
  <rect class="chunk" x="512" y="288" width="180" height="60" rx="10"/><text x="602" y="309">Client.holders()</text><text class="sub" x="602" y="327">chunk.go</text>
</svg>
