<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1022 284" width="1022" height="284" role="img" aria-label="How a storage node starts">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .sub { font-size: 12px; fill: #57606a; }
    .folder { font-size: 13px; font-weight: 600; fill: #57606a; text-anchor: start; }
    .web { fill: #ffe3c4; } .p-web { fill: #fff6ec; }
    .nginx { fill: #cdeee8; } .p-nginx { fill: #effaf8; }
    .api { fill: #d8e6ff; } .p-api { fill: #f2f6ff; }
    .queue { fill: #e5dbff; } .p-queue { fill: #f7f3ff; }
    .worker { fill: #d3efdc; } .p-worker { fill: #f0f9f3; }
    .storage { fill: #ffd8e4; } .p-storage { fill: #fff3f7; }
    .chunk { fill: #fff1b8; } .p-chunk { fill: #fffbe6; }
    .ext { fill: #eaeef2; } .p-ext { fill: #f6f8fa; }
    .ln { fill: none; stroke: #6e7781; stroke-width: 1.6; stroke-linecap: round; }
    .head { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .folder { fill: #c9d1d9; }
      .web { fill: #6b4e30; } .p-web { fill: #3a2e22; }
      .nginx { fill: #2f6158; } .p-nginx { fill: #243b38; }
      .api { fill: #34507e; } .p-api { fill: #263147; }
      .queue { fill: #4f4180; } .p-queue { fill: #312a47; }
      .worker { fill: #326343; } .p-worker { fill: #253a2d; }
      .storage { fill: #7a3a52; } .p-storage { fill: #3d2630; }
      .chunk { fill: #6b5a1e; } .p-chunk { fill: #3a3320; }
      .ext { fill: #3d444d; } .p-ext { fill: #30363d; }
      .ln { stroke: #a0a8b0; }
      .head { fill: #a0a8b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Q2.6 5 1 1.5 Z"/>
    </marker>
  </defs>

  <!-- Lines. Each one is a single straight segment. -->
  <path class="ln" d="M174 54 H230" marker-end="url(#a)"/>
  <path class="ln" d="M174 142 H230" marker-end="url(#a)"/>
  <path class="ln" d="M174 230 H230" marker-end="url(#a)"/>
  <path class="ln" d="M380 54 H436" marker-end="url(#a)"/>
  <path class="ln" d="M380 142 H436" marker-end="url(#a)"/>
  <path class="ln" d="M380 230 H436" marker-end="url(#a)"/>
  <path class="ln" d="M586 142 H642" marker-end="url(#a)"/>
  <path class="ln" d="M792 142 H848" marker-end="url(#a)"/>
  <path class="ln" d="M586 230 H642" marker-end="url(#a)"/>

  <!-- Boxes -->
  <rect class="storage" x="24" y="24" width="150" height="236" rx="10"/><text x="99" y="133">run()</text><text class="sub" x="99" y="151">main.go</text>
  <rect class="storage" x="230" y="24" width="150" height="60" rx="10"/><text x="305" y="45">parsePeers()</text><text class="sub" x="305" y="63">cluster.go</text>
  <rect class="storage" x="230" y="112" width="150" height="60" rx="10"/><text x="305" y="133">newFSM()</text><text class="sub" x="305" y="151">fsm.go</text>
  <rect class="storage" x="230" y="200" width="150" height="60" rx="10"/><text x="305" y="221">startRaft()</text><text class="sub" x="305" y="239">cluster.go</text>
  <rect class="storage" x="436" y="24" width="150" height="236" rx="10"/><text x="511" y="133">node</text><text class="sub" x="511" y="151">chunks.go</text>
  <rect class="storage" x="642" y="112" width="150" height="60" rx="10"/><text x="717" y="133">routes()</text><text class="sub" x="717" y="151">chunks.go</text>
  <rect class="ext" x="848" y="112" width="150" height="60" rx="10"/><text x="923" y="133">http.Server</text><text class="sub" x="923" y="151">Port 9001 to 9003</text>
  <rect class="storage" x="642" y="200" width="150" height="60" rx="10"/><text x="717" y="221">repairLoop()</text><text class="sub" x="717" y="239">repair.go</text>
</svg>
